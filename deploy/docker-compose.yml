services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: fiber
      MYSQL_USER: fiber
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须设置 MYSQL_PASSWORD}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  api:
    build: ../backend
    environment:
      DATABASE_URL: mysql+pymysql://fiber:${MYSQL_PASSWORD:?}@mysql/fiber?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:?必须设置 JWT_SECRET（长度≥32）}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:?必须设置初始管理员密码}
      ENV: prod
      API_PREFIX: /fiber/api/v1
    depends_on:
      mysql: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    image: nginx:alpine
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["80:80"]
    depends_on: [api]

volumes:
  mysql-data:
